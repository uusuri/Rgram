[package]
name = "Rgram"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[dependencies]
tdlib-rs = { version = "=1.4.0", features = ["local-tdlib"] }
iced = { version = "0.14.0", features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
dotenvy = "0.15.7"
